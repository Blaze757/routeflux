name: CI

on:
  push:
    branches:
      - dev
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROUTEFLUX_INSECURE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false

      - name: Check formatting
        run: |
          out="$(gofmt -l $(find . -type f -name '*.go' -not -path './bin/*' -not -path './dist/*' -not -path './.cache/*'))"
          if [ -n "$out" ]; then
            echo "Files needing gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        if: always()
        run: |
          set -o pipefail
          go test -v -count=1 -timeout 120s ./internal/... ./pkg/... ./cmd/... ./test/release/ ./test/luci/ 2>&1 | tee /tmp/test-output.txt
          exit ${PIPESTATUS[0]}

      - name: Commit test output
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/test-output.txt', 'utf8');
            const truncated = output.length > 16000 ? output.slice(-16000) : output;
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'test-output.log',
              message: `ci: commit test output for debugging (run ${context.runId})`,
              content: Buffer.from(truncated).toString('base64'),
              branch: context.ref.replace('refs/heads/', '')
            });
