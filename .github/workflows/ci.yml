name: CI

on:
  push:
    branches:
      - dev
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Check gofmt
        run: |
          echo "=== Checking gofmt ==="
          out="$(gofmt -l $(find . -type f -name '*.go' -not -path './bin/*' -not -path './dist/*' -not -path './.cache/*'))"
          if [ -n "$out" ]; then
            echo "Files needing gofmt:"
            echo "$out"
            exit 1
          fi
          echo "gofmt OK"

      - name: Check go vet
        run: |
          echo "=== Running go vet ==="
          go vet ./...
          echo "go vet OK"
        env:
          ROUTEFLUX_INSECURE: "1"

      - name: Run unit tests
        run: |
          echo "=== Running go test ==="
          go test ./...
          echo "go test OK"
        env:
          ROUTEFLUX_INSECURE: "1"

      - name: Enforce runtime coverage gate
        run: make coverage-runtime
        env:
          ROUTEFLUX_INSECURE: "1"
