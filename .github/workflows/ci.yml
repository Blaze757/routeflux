name: CI

on:
  push:
    branches:
      - dev
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROUTEFLUX_INSECURE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Check formatting
        run: |
          out="$(gofmt -l $(find . -type f -name '*.go' -not -path './bin/*' -not -path './dist/*' -not -path './.cache/*'))"
          if [ -n "$out" ]; then
            echo "Files needing gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (internal)
        id: test-internal
        run: go test -v -count=1 ./internal/... 2>&1 | tee /tmp/internal.log; rc=${PIPESTATUS[0]}; echo "exit_code=$rc" >> $GITHUB_OUTPUT; exit $rc

      - name: Test (pkg+cmd)
        id: test-pkg
        run: go test -v -count=1 ./pkg/... ./cmd/... 2>&1 | tee /tmp/pkg.log; rc=${PIPESTATUS[0]}; echo "exit_code=$rc" >> $GITHUB_OUTPUT; exit $rc

      - name: Test (release)
        id: test-release
        run: go test -v -count=1 ./test/release/ 2>&1 | tee /tmp/release.log; rc=${PIPESTATUS[0]}; echo "exit_code=$rc" >> $GITHUB_OUTPUT; exit $rc

      - name: Test (luci)
        id: test-luci
        run: go test -v -count=1 ./test/luci/ 2>&1 | tee /tmp/luci.log; rc=${PIPESTATUS[0]}; echo "exit_code=$rc" >> $GITHUB_OUTPUT; exit $rc

      - name: Summarize failures
        if: failure()
        run: |
          echo '## Test Failure Summary' >> $GITHUB_STEP_SUMMARY
          for f in /tmp/internal.log /tmp/pkg.log /tmp/release.log /tmp/luci.log; do
            if [ -f "$f" ] && grep -q "^--- FAIL" "$f"; then
              echo "### Failures in $(basename $f .log)" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -A5 "^--- FAIL" "$f" >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Last 50 lines of each log" >> $GITHUB_STEP_SUMMARY
          for f in /tmp/internal.log /tmp/pkg.log /tmp/release.log /tmp/luci.log; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              echo "#### $(basename $f .log)" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -50 "$f" >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          done
          # Upload as artifact for later inspection
          echo "# CI test logs" > /tmp/ci-debug.md
          for f in /tmp/internal.log /tmp/pkg.log /tmp/release.log /tmp/luci.log; do
            if [ -f "$f" ]; then
              echo "## $(basename $f .log)" >> /tmp/ci-debug.md
              echo '```' >> /tmp/ci-debug.md
              cat "$f" >> /tmp/ci-debug.md || true
              echo '```' >> /tmp/ci-debug.md
            fi
          done

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/*.log
          retention-days: 7

      - name: Runtime coverage gate
        if: success()
        run: make coverage-runtime
