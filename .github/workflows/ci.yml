name: CI

on:
  push:
    branches:
      - dev
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROUTEFLUX_INSECURE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false

      - name: Check formatting
        run: |
          out="$(gofmt -l $(find . -type f -name '*.go' -not -path './bin/*' -not -path './dist/*' -not -path './.cache/*'))"
          if [ -n "$out" ]; then
            echo "Files needing gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 -timeout 120s ./internal/... ./pkg/... ./cmd/... ./test/release/ ./test/luci/ 2>&1 | tee /tmp/test-output.txt

      - name: Capture test output
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/test-output.txt', 'utf8');
            const runId = context.runId;
            const sha = context.sha.substring(0, 7);
            const body = `## CI Test Output (run ${runId}, commit ${sha})\n\n\`\`\`\n${output.slice(-8000)}\n\`\`\``;

            // Create a gist
            const gist = await github.rest.gists.create({
              description: `routeflux CI test output - run ${runId}`,
              files: { 'test-output.txt': { content: output.slice(-16000) } }
            });
            console.log(`Gist URL: ${gist.data.html_url}`);

            // Post as check run annotation comment
            core.setOutput('gist_url', gist.data.html_url);
            core.summary.addRaw(`Test output: ${gist.data.html_url}\n`);
            await core.summary.write();
