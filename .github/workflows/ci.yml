name: CI

on:
  push:
    branches:
      - dev
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROUTEFLUX_INSECURE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Check formatting
        run: |
          out="$(gofmt -l $(find . -type f -name '*.go' -not -path './bin/*' -not -path './dist/*' -not -path './.cache/*'))"
          if [ -n "$out" ]; then
            echo "Files needing gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 ./internal/... ./pkg/... ./cmd/... ./test/release/ ./test/luci/ > /tmp/test-output.txt 2>&1 || true

      - name: Fetch test output
        if: always()
        run: |
          # Write to step summary
          echo '### Test Output' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Also cat to stdout so it shows in the GitHub Actions log (visible to repo owner)
          cat /tmp/test-output.txt

      - name: Fail if tests failed
        if: always()
        run: |
          if grep -q "^FAIL" /tmp/test-output.txt; then
            echo "Tests failed!"
            exit 1
          fi
          echo "All tests passed"
