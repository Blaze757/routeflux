name: CI

on:
  push:
    branches:
      - dev
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROUTEFLUX_INSECURE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Check formatting
        run: |
          out="$(gofmt -l $(find . -type f -name '*.go' -not -path './bin/*' -not -path './dist/*' -not -path './.cache/*'))"
          if [ -n "$out" ]; then
            echo "Files needing gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run all tests
        run: |
          go test -v -count=1 ./internal/... ./pkg/... ./cmd/... ./test/release/ ./test/luci/ 2>&1 | tee /tmp/test-output.txt; rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "## Test Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "^(=== RUN|--- FAIL|--- PASS|FAIL|ok)" /tmp/test-output.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Full failure context" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -B5 -A20 "^--- FAIL" /tmp/test-output.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Runtime coverage gate
        if: success()
        run: make coverage-runtime
