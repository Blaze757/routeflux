name: CI

on:
  push:
    branches:
      - dev
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROUTEFLUX_INSECURE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Check gofmt
        run: |
          out="$(gofmt -l $(find . -type f -name '*.go' -not -path './bin/*' -not -path './dist/*' -not -path './.cache/*'))"
          if [ -n "$out" ]; then
            echo "Files needing gofmt:"
            echo "$out"
            exit 1
          fi
          echo "gofmt OK"

      - name: Check go vet
        run: go vet ./...

      - name: Test internal/parser
        run: go test -v -count=1 ./internal/parser/

      - name: Test internal/probe
        run: go test -v -count=1 ./internal/probe/

      - name: Test internal/backend
        run: go test -v -count=1 ./internal/backend/

      - name: Test internal/cli
        run: go test -v -count=1 ./internal/cli/

      - name: Test internal/store
        run: go test -v -count=1 ./internal/store/

      - name: Test internal/app
        run: go test -v -count=1 ./internal/app/

      - name: Test internal/domain
        run: go test -v -count=1 ./internal/domain/

      - name: Test internal/platform/openwrt
        run: go test -v -count=1 ./internal/platform/openwrt/

      - name: Test pkg/api
        run: go test -v -count=1 ./pkg/api/

      - name: Test internal/tui
        run: go test -v -count=1 ./internal/tui/

      - name: Test remaining packages
        run: go test -v -count=1 ./internal/buildinfo/ ./internal/displaytime/ ./internal/speedtest/

      - name: Test release tests
        run: go test -v -count=1 ./test/release/
