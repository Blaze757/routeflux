name: CI

on:
  push:
    branches:
      - dev
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROUTEFLUX_INSECURE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Check formatting
        run: |
          out="$(gofmt -l $(find . -type f -name '*.go' -not -path './bin/*' -not -path './dist/*' -not -path './.cache/*'))"
          if [ -n "$out" ]; then
            echo "Files needing gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run all tests with output capture
        run: |
          go test -v -count=1 ./internal/... ./pkg/... ./cmd/... ./test/release/ ./test/luci/ 2>&1 | tee /tmp/test-output.txt || true
          if grep -q "^--- FAIL" /tmp/test-output.txt; then
            echo "=== FAILED TESTS ==="
            grep "^--- FAIL" /tmp/test-output.txt
            echo ""
            echo "=== FAILURE DETAILS ==="
            grep -B2 -A10 "^--- FAIL" /tmp/test-output.txt
            exit 1
          fi
          echo "All tests passed"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: /tmp/test-output.txt
          if-no-files-found: ignore

      - name: Runtime coverage gate
        if: success()
        run: make coverage-runtime
